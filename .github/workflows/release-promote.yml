# Promote (the release-flow skill). Kade runs it on the branch rc/vX.Y.Z-rc.N that Candidate
# (release-candidate.yml) made (the GitHub app lists branches, not tags), after trying that
# prerelease. The tag is the record and the branch only a handle: it refuses unless the branch
# head is the rc tag's commit, the tag is the highest rc of a version that is not released yet and
# is above the latest release, the version at that commit is that version, and the prerelease
# exists (scripts/release_flow.py rc-branch, check-promote). It then downloads the prerelease's
# files, checks them against SHA256SUMS, tags the same commit vX.Y.Z and makes the GitHub release,
# marked latest, with those files and the prerelease's notes: nothing is built again. Last, it
# deletes the rc branches of that version and every older one; a failed run keeps them.
# Only the tag job can write, and it runs none of the caller's code.
# Reusable: the caller adds a workflow with
#   on: workflow_dispatch
#   permissions: {}
#   concurrency: { group: release, cancel-in-progress: false }
#   jobs: { promote: { permissions: { contents: write }, uses: stella-rain/.github/.github/workflows/release-promote.yml@main, with: {...} } }
# A called workflow cannot hold more than its caller grants, so the caller's job grants
# `contents: write`. `concurrency` stays in the caller: a group here would block the caller's own.
# Inputs, all optional:
#   version-command   run at the root of a checkout of the rc commit; prints the version X.Y.Z there
#   check-command     extra refusals once the assets are downloaded (env ASSETS_DIR, RC, FINAL); a
#                     non-zero exit refuses
#   assets-artifact   the artifact `check` hands the assets to `tag` with (default release-assets)
#   runs-on           the runner as JSON (default "ubuntu-latest"); public callers never pass it
# The script comes from this repository's main, checked out to .release-flow.
name: Release promote

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner as JSON, a label or a list of labels (default "ubuntu-latest")
        type: string
        required: false
        default: '"ubuntu-latest"'
      version-command:
        description: A command that prints the version X.Y.Z of the checkout it runs in
        type: string
        required: false
        default: ''
      check-command:
        description: Extra refusals after the assets are downloaded (env ASSETS_DIR, RC, FINAL); non-zero refuses
        type: string
        required: false
        default: ''
      assets-artifact:
        description: The artifact that hands the prerelease's files from check to tag
        type: string
        required: false
        default: release-assets

permissions: {}

jobs:
  check:
    name: check the candidate
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      final: ${{ steps.check.outputs.final }}
      commit: ${{ steps.check.outputs.commit }}
      rc: ${{ steps.check.outputs.rc }}
      released: ${{ steps.check.outputs.released }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - name: Only an rc/<rc tag> branch is promoted
        run: |
          case "$GITHUB_REF" in
            refs/heads/rc/v*-rc.*) ;;
            *) echo "::error::Promote runs on a branch rc/vX.Y.Z-rc.N only; this run is on $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check out the release script
        uses: actions/checkout@v7
        with:
          repository: stella-rain/.github
          ref: main
          path: .release-flow
          persist-credentials: false
      - name: The candidate is the newest of a new version, with its prerelease and its files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION_COMMAND: ${{ inputs.version-command }}
          CHECK_COMMAND: ${{ inputs.check-command }}
          ASSETS_ARTIFACT: ${{ inputs.assets-artifact }}
        run: |
          set -euo pipefail
          rf() { python3 "$GITHUB_WORKSPACE/.release-flow/scripts/release_flow.py" "$@"; }
          if [ -z "$VERSION_COMMAND" ]; then
            echo "::error::the version-command input is empty"
            exit 1
          fi
          rc=$(rf rc-branch "$GITHUB_REF_NAME")
          commit=$(git rev-parse "refs/tags/$rc^{commit}")
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME is at $GITHUB_SHA, not at its tag $rc ($commit)"
            exit 1
          fi
          if [ "$(gh release view "$rc" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" != true ]; then
            echo "::error::$rc has no prerelease"
            exit 1
          fi
          export ASSETS_DIR="$RUNNER_TEMP/dist"
          mkdir "$ASSETS_DIR"
          gh release download "$rc" --repo "$REPO" --dir "$ASSETS_DIR"
          rf verify-sums "$ASSETS_DIR"
          version=$(bash -c "$VERSION_COMMAND")
          final=$(rf check-promote "$rc" "$version")
          released=$(rf released "$final")
          if [ -n "$CHECK_COMMAND" ]; then
            RC=$rc FINAL=$final bash -c "$CHECK_COMMAND"
          fi
          {
            echo "$final, promoted from $rc."
            echo
            gh release view "$rc" --repo "$REPO" --json body --jq .body
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "final=$final"
            echo "commit=$commit"
            echo "rc=$rc"
            echo "released=$released"
            echo "notes=$(base64 -w0 "$RUNNER_TEMP/notes.md")"
          } >> "$GITHUB_OUTPUT"
      - name: Hand the checked files to the tag job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.assets-artifact }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 1

  tag:
    name: tag and GitHub release
    needs: check
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: write  # the tag, the release and deleting the rc branches
    steps:
      - name: Check out the release script
        uses: actions/checkout@v7
        with:
          repository: stella-rain/.github
          ref: main
          path: .release-flow
          persist-credentials: false
      - name: Fetch the checked files
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.assets-artifact }}
          path: ${{ runner.temp }}/dist
      - name: Tag the candidate's commit, make the release with its files, delete the rc branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FINAL: ${{ needs.check.outputs.final }}
          COMMIT: ${{ needs.check.outputs.commit }}
          RC: ${{ needs.check.outputs.rc }}
          RELEASED: ${{ needs.check.outputs.released }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head" != "$COMMIT" ]; then
            echo "::error::$GITHUB_REF_NAME moved from $COMMIT to $head"
            exit 1
          fi
          python3 .release-flow/scripts/release_flow.py verify-sums "$RUNNER_TEMP/dist"
          base64 -d <<<"$NOTES" > "$RUNNER_TEMP/notes.md"
          # An annotated tag object, then its ref; `gh release create` alone would make a
          # lightweight tag.
          object=$(gh api "repos/$REPO/git/tags" -f tag="$FINAL" -f message="$FINAL" \
                     -f object="$COMMIT" -f type=commit --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$FINAL" -f sha="$object" > /dev/null
          gh release create "$FINAL" --repo "$REPO" --verify-tag --latest --title "$FINAL" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/dist/*
          for b in $RELEASED; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null || echo "::warning::could not delete $b"
          done
          {
            echo "Released $FINAL at $COMMIT, promoted from $RC."
            echo "Deleted the rc branches $RELEASED."
          } >> "$GITHUB_STEP_SUMMARY"
