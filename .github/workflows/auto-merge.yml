# Reusable: merges a pull request from a `claude/*` branch (or another branch prefix the caller
# lists in `prefixes`) into main once every check on its
# latest commit is green, then deletes the branch. Called by app's and core's auto-merge.yml
# on `workflow_run` (completed) of each of their checks; the run that finds the last check
# green merges. Anything else is left for a person: a failed or cancelled check, another
# branch prefix, a fork, a stale run, a pull request into any other branch, a draft, and a
# pull request that changes `.github/workflows/` (or a caller's `protected` path) or whose
# file list cannot be read whole.
# `require` names checks that must have succeeded: with several workflows starting this one,
# the last to finish may be the only one started yet, and a check not started yet must not
# count as green. Name only checks that run on every pull request into main; one that is
# skipped or path-filtered never succeeds, and the PR then waits for Kade.
# A merge made with GITHUB_TOKEN does not apply closing keywords (`Closes #N`), so after
# merging it closes the PR's closing issues in the same repository itself.
# `workflow_run` workflows are read from the caller's default branch, so a caller's
# auto-merge.yml takes effect once it is on main.
# Two tokens. Every read (pull requests, check runs, commit status, files) uses the job's
# GITHUB_TOKEN: the job grants it checks: read and statuses: read, which the App token lacks
# (it has contents, pull-requests and issues only), and a private repository enforces them.
# Only the writes (merge, branch deletion, issue closing) use a token of the stella-rain-bridge
# GitHub App, when the caller passes the secret BRIDGE_APP_PRIVATE_KEY (`secrets: inherit`;
# the client ID is vars.BRIDGE_APP_CLIENT_ID, as in project-sync.yml): a merge by that App
# starts the `push` runs on main. Without the secret the writes use the caller's GITHUB_TOKEN,
# which starts none, and the run's summary says so.
# The output `merged` is `true` once this run merged the PR: a caller that needs a run on main
# after a merge (to re-save a build cache, say) starts it in a job of its own.
# A PR is merged only when its head commit contains main's head (the compare API says
# `identical` or `ahead`), like GitHub's "require branches to be up to date". A branch behind
# main is not merged and not updated (a push with GITHUB_TOKEN starts no runs, and it would race
# the person pushing to the branch): it gets one comment per head of main, marked
# `<!-- auto-merge:behind:<main sha> -->`, asking for main to be merged in; that push re-runs
# the checks, and the next green run merges. main can still move between the compare and the
# merge (seconds); --match-head-commit guards the PR head only, so only GitHub's own rule is atomic.
# A check run the Checks API still shows as pending, although its check suite is the one of the
# workflow run that started this run (a completed run has no running job), is `stale`: the gate
# says `stale` when the verdict would be `merge` otherwise. Only then the step sleeps and reads
# the checks again, STALE_RETRIES times STALE_SLEEP seconds (6 x 20 s, inside the job's cap); a
# PR still stale after that waits like any other, for a re-run of this run or for Kade. Other
# verdicts (`wait` for a workflow still running, `behind`, `stop`, `merge`) go on at once.
# `runs-on` lets a private caller pick its own runner; here and by default, ubuntu-latest.
name: Auto-merge (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner as JSON, a label or a list of labels (default "ubuntu-latest")
        type: string
        required: false
        default: '"ubuntu-latest"'
      require:
        description: Check run names that must have succeeded, one per line (default none)
        type: string
        required: false
        default: ""
      protected:
        description: >
          Paths left to Kade besides .github/workflows/, one per line; a path ending in /
          is a directory (default none)
        type: string
        required: false
        default: ""
      prefixes:
        description: >
          Head branch prefixes this workflow merges and deletes, separated by spaces
          (default "claude/")
        type: string
        required: false
        default: "claude/"
    secrets:
      BRIDGE_APP_PRIVATE_KEY:
        required: false
        description: The bridge GitHub App's private key; with it the merge starts push runs on main
    outputs:
      merged:
        description: '"true" when this run merged the pull request'
        value: ${{ jobs.merge.outputs.merged }}

permissions: {}

jobs:
  merge:
    name: merge when every check is green
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write       # merge, delete the branch
      pull-requests: write  # merge
      issues: write         # close the PR's closing issues
      checks: read          # the head commit's check runs
      statuses: read        # the head commit's commit statuses
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      HAS_APP_KEY: ${{ secrets.BRIDGE_APP_PRIVATE_KEY != '' }}
    concurrency:
      group: auto-merge-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check the branch prefix
        id: prefix
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PREFIXES: ${{ inputs.prefixes || 'claude/' }}
        run: |
          set -euo pipefail
          match=false
          for prefix in $PREFIXES; do
            case "$BRANCH" in
              "$prefix"*) match=true ;;
            esac
          done
          if [ "$match" != true ]; then echo "$BRANCH does not start with any of: $PREFIXES"; fi
          echo "match=$match" >> "$GITHUB_OUTPUT"

      - name: Check out the gate script
        if: ${{ steps.prefix.outputs.match == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: stella-rain/.github
          ref: main
          path: .bridge
          persist-credentials: false

      - name: Get a merge token from the bridge App
        id: app-token
        if: ${{ steps.prefix.outputs.match == 'true' && env.HAS_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Warn that the merge starts no push runs
        if: ${{ steps.prefix.outputs.match == 'true' && env.HAS_APP_KEY != 'true' }}
        run: |
          echo "BRIDGE_APP_PRIVATE_KEY not passed: merging with GITHUB_TOKEN, which starts no push runs on main (pass secrets: inherit)." >> "$GITHUB_STEP_SUMMARY"

      - name: Merge if every check is green
        id: merge
        if: ${{ steps.prefix.outputs.match == 'true' }}
        env:
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIRE: ${{ inputs.require }}
          PROTECTED: ${{ inputs.protected }}
          PREFIXES: ${{ inputs.prefixes || 'claude/' }}
          SUITE_ID: ${{ github.event.workflow_run.check_suite_id }}
          STALE_RETRIES: "6"
          STALE_SLEEP: "20"
        run: |
          set -euo pipefail
          pr=$(GH_TOKEN="$READ_TOKEN" gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
                 --json number,headRefOid --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then echo "no open PR from $BRANCH into main"; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          # The green run must be for the PR's latest commit, not an older push.
          if [ "$head" != "$RUN_SHA" ]; then echo "run is for $RUN_SHA, PR head is $head; waiting for its runs"; exit 0; fi
          # Drafts and PRs that change the workflows or a protected path go to Kade.
          GH_TOKEN="$READ_TOKEN" gh api "repos/$REPO/pulls/$number" --jq '{draft, changed_files}' > "$RUNNER_TEMP/pr.json"
          GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/$REPO/pulls/$number/files?per_page=100" \
            --jq '.[] | {filename, previous_filename}' | jq -s . > "$RUNNER_TEMP/files.json"
          attempt=0
          while :; do
            GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/$REPO/commits/$RUN_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, status, conclusion, check_suite_id: .check_suite.id}' | jq -s . > "$RUNNER_TEMP/check-runs.json"
            GH_TOKEN="$READ_TOKEN" gh api "repos/$REPO/commits/$RUN_SHA/status" \
              --jq '{state, total_count}' > "$RUNNER_TEMP/status.json"
            # The PR head must contain main's head; the status is `identical` or `ahead` then.
            GH_TOKEN="$READ_TOKEN" gh api "repos/$REPO/compare/main...$RUN_SHA?per_page=1" \
              --jq '{status, ahead_by, behind_by, base: .base_commit.sha}' > "$RUNNER_TEMP/compare.json"
            verdict=$(python3 .bridge/scripts/auto_merge_gate.py --require "$REQUIRE" --protect "$PROTECTED" \
                        --pr "$RUNNER_TEMP/pr.json" --files "$RUNNER_TEMP/files.json" \
                        --compare "$RUNNER_TEMP/compare.json" --completed-suite "$SUITE_ID" \
                        "$RUNNER_TEMP/check-runs.json" "$RUNNER_TEMP/status.json")
            echo "PR #$number at $RUN_SHA: $verdict"
            if [ "$verdict" != stale ]; then break; fi
            if [ "$attempt" -ge "$STALE_RETRIES" ]; then
              verdict="wait"
              echo "PR #$number: checks still in progress after $STALE_RETRIES re-reads; re-run this workflow run to retry" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            attempt=$((attempt + 1))
            sleep "$STALE_SLEEP"
          done
          if [ "$verdict" = behind ]; then
            # One comment per head of main: the marker line says which.
            python3 .bridge/scripts/auto_merge_gate.py --behind-comment "$RUNNER_TEMP/compare.json" > "$RUNNER_TEMP/behind.md"
            marker=$(head -n 1 "$RUNNER_TEMP/behind.md")
            # Read into a file first: under pipefail, `grep -q` closing the pipe early would fail the read.
            GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/$REPO/issues/$number/comments" \
              --jq '.[].body' > "$RUNNER_TEMP/comments.txt"
            if grep -qF "$marker" "$RUNNER_TEMP/comments.txt"; then
              echo "PR #$number is behind main; already commented"
            else
              GH_TOKEN="$WRITE_TOKEN" gh pr comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/behind.md"
              echo "PR #$number is behind main; commented"
            fi
            echo "PR #$number is behind main; auto-merge waits for an update" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$verdict" != merge ]; then exit 0; fi
          # --match-head-commit refuses the merge if a push landed since the checks were read.
          GH_TOKEN="$WRITE_TOKEN" gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$RUN_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          # Delete only a branch that starts with one of the prefixes, and never anything else.
          delete=false
          for prefix in $PREFIXES; do
            case "$BRANCH" in
              "$prefix"*) delete=true ;;
            esac
          done
          if [ "$delete" = true ]; then
            GH_TOKEN="$WRITE_TOKEN" gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          else
            echo "$BRANCH does not start with any of: $PREFIXES; leaving it"
          fi
          GH_TOKEN="$READ_TOKEN" gh pr view "$number" --repo "$REPO" --json closingIssuesReferences \
            --jq .closingIssuesReferences > "$RUNNER_TEMP/closing.json"
          for issue in $(python3 .bridge/scripts/auto_merge_gate.py --issues-to-close "$RUNNER_TEMP/closing.json" "$REPO"); do
            GH_TOKEN="$WRITE_TOKEN" gh issue close "$issue" --repo "$REPO" --reason completed --comment "Closed by #$number (auto-merge)."
          done
