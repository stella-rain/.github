# Checks the calling repository's tracked files for what a public repository must never hold:
# environment files, key and keystore files, and private key blocks, AWS access key IDs or
# GitHub tokens in text files. Findings name the file, line and kind, never the value.
# Reusable: core and moderation call it from their repo-check.yml; it also runs here, with
# the script of the commit under test, so a change to the script is checked before it merges.
# It runs on every pull request, so a caller with auto-merge names its check in `require:`
# (ADR-052).
# Never called from stage-template: creators copy that repository.
name: Repository check

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    name: no secrets or key files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          path: repo
          persist-credentials: false

      - name: Check out the check script
        if: github.repository != 'stella-rain/.github'
        uses: actions/checkout@v7
        with:
          repository: stella-rain/.github
          ref: main
          path: .check
          persist-credentials: false

      - name: Check
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REPOSITORY" = "stella-rain/.github" ]; then
            script=repo/scripts/repo_check.py
          else
            script=.check/scripts/repo_check.py
          fi
          python3 "$script" repo
